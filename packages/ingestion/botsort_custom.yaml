# Custom BoT-SORT config for WELS handball tracking

tracker_type: botsort
track_high_thresh: 0.25   # first-stage match threshold
track_low_thresh: 0.1     # second-stage threshold for low-score matches
new_track_thresh: 0.25    # min score to start a new track
track_buffer: 60          # frames to keep lost tracks alive (handles occlusion)
match_thresh: 0.8         # association similarity threshold
fuse_score: True          # fuse detection score with IoU for matching

# Global motion compensation — sparseOptFlow works well for moving camera
gmc_method: sparseOptFlow

# ReID — requires osnet_x0_25_market.pt in data/models/ (downloaded on first run)
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model_weights: osnet_x0_25_market.pt
model: auto
